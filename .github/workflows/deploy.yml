name: Deploy to Amazon EC2

on:
  push:
    branches: ["master"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: teaching-platform
  ECR_REGISTRY: 688948287774.dkr.ecr.ca-central-1.amazonaws.com
  EC2_HOST: 15.223.127.30 #mern.garychang1214.com

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY_2 }}
          script: |
            mkdir -p ~/teaching-platform/config/nginx

            cat > ~/teaching-platform/.env << EOL
            MONGODB_CONNECTION=${{ secrets.MONGODB_CONNECTION }}
            PASSPORT_SECRET=${{ secrets.PASSPORT_SECRET }}
            API_URL=${{ secrets.API_URL }}
            EOL

            cat > ~/teaching-platform/config/nginx/nginx.conf << 'EOL'
            user nginx;
            worker_processes auto;
            error_log /var/log/nginx/error.log warn;
            pid /var/run/nginx.pid;

            events {
                worker_connections 1024;
            }

            http {
                include /etc/nginx/mime.types;
                default_type application/octet-stream;
                
                log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';
                access_log /var/log/nginx/access.log main;
                

                sendfile on;
                tcp_nopush on;
                tcp_nodelay on;
                keepalive_timeout 65;
                types_hash_max_size 2048;
                
                gzip on;
                gzip_vary on;
                gzip_proxied any;
                gzip_comp_level 6;
                gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
                
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "no-referrer-when-downgrade" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                

                server {
                    listen 80;
                    server_name api.garychang1214.com;
                    
                    location / {
                        proxy_pass http://app:8080;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection 'upgrade';
                        proxy_set_header Host $host;
                        proxy_cache_bypass $http_upgrade;
                        
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        
                        proxy_connect_timeout 60s;
                        proxy_send_timeout 60s;
                        proxy_read_timeout 60s;
                    }
                    
                    location ~ /\. {
                        deny all;
                    }
                    
                    error_page 404 /404.html;
                    error_page 500 502 503 504 /50x.html;
                }
            }
            EOL

            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

            cd ~/teaching-platform

            docker-compose down || true

            cat > docker-compose.yml << EOL
            version: "3.8"

            services:
              nginx:
                image: nginx:alpine
                ports:
                  - "80:80"
                volumes:
                  - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                  - nginx_cache:/var/cache/nginx
                  - nginx_logs:/var/log/nginx
                depends_on:
                  - app
                restart: always
                networks:
                  - app_network

              app:
                container_name: teaching-platform
                image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
                expose:
                  - "8080"
                env_file:
                  - .env
                restart: always
                networks:
                  - app_network

            networks:
              app_network:
                driver: bridge

            volumes:
              nginx_cache:
              nginx_logs:
            EOL

            docker-compose up -d

            docker image prune -af
